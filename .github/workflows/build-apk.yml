name: Build Android APK

on:
  push:
    branches: [ main, audit-offline ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web PWA Assets
        run: npm run build:pwa

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/vui-hoc-doc-truyen-v1.0.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vui-hoc-doc-truyen-apk
          path: release-apk/vui-hoc-doc-truyen-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/audit-offline'
        with:
          tag_name: v1.0.0-apk
          name: "Vui Học - Đọc Truyện (Bản cài đặt Android APK v1.0.0)"
          body: |
            ## 📱 Bản cài đặt ứng dụng Android (.APK)
            - **Tên ứng dụng:** Vui Học - Đọc Truyện
            - **Phiên bản:** v1.0.0
            - **Hệ điều hành:** Android 7.0 trở lên (Samsung, Xiaomi, Oppo, Vivo, v.v.)
            - **Tính năng:** Chạy 100% Offline, đầy đủ âm thanh, karaoke đồng bộ, trò chơi đàn cầu vồng và 520 flashcards học tiếng Anh.
            
            ### Hướng dẫn cài đặt trên Android:
            1. Tải file `vui-hoc-doc-truyen-v1.0.apk` bên dưới về điện thoại.
            2. Nhấn vào file APK vừa tải về để cài đặt.
            3. Nếu máy hỏi *"Cho phép cài đặt ứng dụng từ nguồn này"*, hãy gạt bật Cho phép.
            4. Mở ứng dụng và bắt đầu học tập và vui chơi!
          files: release-apk/vui-hoc-doc-truyen-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
