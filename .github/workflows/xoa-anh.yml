name: Xoa anh khong dung
on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Gõ yes để xóa thật (để trống = chỉ xem trước)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chay script
        env:
          DO_DELETE: ${{ github.event.inputs.delete }}
        run: |
          cat > /tmp/clean.cjs <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const imgDir = path.join(root, 'src', 'assets', 'images');
          const doDelete = process.argv.includes('--delete');
          function walk(dir, out = []) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { if (p !== imgDir) walk(p, out); }
              else if (/\.(ts|tsx|js|jsx|json|css|html)$/.test(e.name)) out.push(p);
            }
            return out;
          }
          let text = '';
          for (const f of walk(path.join(root, 'src'))) text += fs.readFileSync(f, 'utf8');
          for (const f of ['index.html', 'server.ts']) {
            const p = path.join(root, f);
            if (fs.existsSync(p)) text += fs.readFileSync(p, 'utf8');
          }
          const unused = fs.readdirSync(imgDir).filter((f) => !text.includes(f));
          let bytes = 0;
          for (const f of unused) {
            const p = path.join(imgDir, f);
            bytes += fs.statSync(p).size;
            if (doDelete) fs.unlinkSync(p);
          }
          console.log((doDelete ? 'Da xoa: ' : 'Xem truoc: ') + unused.length + ' anh, ' + (bytes / 1e6).toFixed(1) + ' MB');
          EOF
          if [ "$DO_DELETE" = "yes" ]; then
            git tag backup-anh-truoc-khi-xoa
            git push origin backup-anh-truoc-khi-xoa
            node /tmp/clean.cjs --delete
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Xoa anh khong dung de giam dung luong build"
            git push
          else
            node /tmp/clean.cjs
          fi
