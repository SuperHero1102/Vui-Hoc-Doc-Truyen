    <title>Vui Học - Đọc Truyện</title>
    <script>
      (function() {
        // 1. Prevent Vite HMR WebSocket from failing in AI Studio container where HMR is disabled
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          const PatchedWebSocket = function(url, protocols) {
            const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            const urlStr = String(url || '');
            if (
              protoStr.includes('vite-hmr') ||
              protoStr.includes('vite-ping') ||
              urlStr.includes('?token=')
            ) {
              const target = new EventTarget();
              target.readyState = 1; // OPEN
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.url = urlStr;
              target.protocol = protoStr;
              target. bufferedAmount = 0;
              target.extensions = '';
              target.binaryType = 'blob';
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
              };
              return target;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }

        // 2. Suppress any residual Vite WebSocket console errors or unhandled rejections
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
          if (
            msg.includes('WebSocket closed without opened') ||
            msg.includes('failed to connect to websocket') ||
            (msg.includes('WebSocket') && msg.includes('@vite/client'))
          ) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = (event.message || '') + ' ' + (event.filename || '') + ' ' + (event.error && event.error.stack ? event.error.stack : '');
          if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = (reason && (reason.stack || reason.message)) ? (reason.stack || reason.message) : String(reason || '');
          if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
